name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix Gradle Project
        run: |
          flutter create -t app temp_fix
          cp -r lib temp_fix/
          cp -r lib/multiplayer temp_fix/lib/multiplayer/ || true
          cp pubspec.yaml temp_fix/
          rm -rf lib android ios pubspec.yaml
          cp -r temp_fix/lib .
          cp -r temp_fix/android .
          cp temp_fix/pubspec.yaml .
          rm -rf temp_fix
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jogo-da-velha-apk
          path: build/app/outputs/flutter-apk/app-release.apk
